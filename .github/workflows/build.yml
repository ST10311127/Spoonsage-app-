name: Android CI

# Builds and unit-tests SpoonSage on every push/PR to main, so the app is
# proven to compile and pass its tests somewhere other than "my machine"
# (Learning Unit 2 - automated testing with GitHub Actions).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # google-services.json is gitignored (it's project-specific Firebase
      # config, see .gitignore) - CI writes it from a repo secret instead.
      # Add the secret in: Settings > Secrets and variables > Actions >
      # New repository secret, name GOOGLE_SERVICES_JSON, value = the
      # *base64-encoded* contents of your app/google-services.json, e.g.:
      #   base64 -i app/google-services.json | pbcopy   (macOS)
      #   base64 -w 0 app/google-services.json           (Linux, then copy)
      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON repository secret - see comment in this workflow file."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Caches the Gradle wrapper + dependencies between runs for faster builds.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Always upload the test report, pass or fail, so a failure is easy to read.
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: spoonsage-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
